<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D6A6"/>
      <stop offset="1" stop-color="#2F86E8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#gloss)"/>
  <!-- 插槽连线：上、下、左三张卡插好了，右边那张正在插拔 -->
  <g stroke="#fff" stroke-width="36" stroke-linecap="round">
    <line x1="512" y1="362" x2="512" y2="262"/>
    <line x1="512" y1="662" x2="512" y2="762"/>
    <line x1="362" y1="512" x2="262" y2="512"/>
    <line x1="662" y1="512" x2="712" y2="512"/>
  </g>
  <!-- 主板：中间的 Context -->
  <rect x="362" y="362" width="300" height="300" rx="72" fill="#fff"/>
  <g fill="#1FA2C4">
    <rect x="404" y="404" width="58" height="58" rx="15"/>
    <rect x="483" y="404" width="58" height="58" rx="15" fill-opacity="0.16"/>
    <rect x="562" y="404" width="58" height="58" rx="15" fill-opacity="0.16"/>
    <rect x="404" y="483" width="58" height="58" rx="15"/>
    <rect x="483" y="483" width="58" height="58" rx="15"/>
    <rect x="562" y="483" width="58" height="58" rx="15" fill-opacity="0.16"/>
    <rect x="404" y="562" width="58" height="58" rx="15"/>
    <rect x="483" y="562" width="58" height="58" rx="15"/>
    <rect x="562" y="562" width="58" height="58" rx="15"/>
  </g>
  <!-- 插件卡 -->
  <rect x="437" y="112" width="150" height="150" rx="40" fill="#fff"/>
  <rect x="437" y="762" width="150" height="150" rx="40" fill="#fff"/>
  <rect x="112" y="437" width="150" height="150" rx="40" fill="#fff"/>
  <rect x="772" y="437" width="150" height="150" rx="40" fill="#fff" fill-opacity="0.55"/>
</svg>
